[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "fusion-vision-mcp"
version = "0.8.2"
description = """\
    An MCP server for processing images using Florence-2, Moondream2, SAM2, CLIP, Grounding DINO, EasyOCR, and ONNX IQA models for captioning, OCR, \
    object detection/grounding, instance counting, visual question answering, spatial measurement and aesthetic scoring\
    """
readme = "README.md"
authors = [
    { name = "Junpei Kawamoto", email = "kawamoto.junpei.s64@kyoto-u.jp" },
    { name = "Whoawhen", email = "warrens951@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "einops>=0.8.1",
    "mcp>=2",
    "numpy>=2.1",
    "pillow>=11.3",
    "pydantic>=2.11.9",
    "pypdfium2>=4.30",
    # Required by vikhyatk/moondream2's trust_remote_code module, not by this package
    # directly. The [binary] extra ships the libvips shared libraries in the wheel, so no
    # system-wide libvips install or PATH entry is needed.
    "pyspellchecker>=0.9.0",
    "pyvips[binary]>=2.2",
    "requests>=2.32.3",
    "rich-click>=1.8.8",
    # Distance transforms behind the contact/containment measurements in geometry.py.
    "scipy>=1.14",
    "timm>=1.0.15",
    "torch>=2.13",
    "torchvision>=0.18",
    # Pinned to the narrow window where Florence2ForConditionalGeneration (added ~4.57) is
    # native AND vikhyatk/moondream2's trust_remote_code model still loads: transformers 5.x
    # renamed internals (`all_tied_weights_keys`) that moondream2's HfMoondream class relies on.
    # The pin does not cover attention backends: HfMoondream rejects
    # attn_implementation="sdpa" throughout this range and transformers names "eager"
    # as the alternative, so moondream.py must pass "eager". Verified on 4.57.6.
    "transformers>=4.57.2,<5",
]
scripts.fusion-vision-mcp = "fusion_vision_mcp.cli:main"

[project.optional-dependencies]
ocr-specialist = [
    "easyocr>=1.7.2",
]
iqa = [
    "onnxruntime>=1.15.0",
    "huggingface-hub>=0.23.0"
]

[dependency-groups]
dev = [
    "bump-my-version>=1.1.1",
    "pre-commit>=4.2",
    "pre-commit-uv>=4.1.4",
    "pytest>=8.3.4",
    # ~70 tests are @pytest.mark.anyio; without this the suite errors at setup.
    "anyio>=4.4",
    # [tool.mypy] below is unusable without it.
    "mypy>=1.11",
    "types-requests>=2.32.0.20250328",
]

[tool.pytest.ini_options]
# Bare `pytest` at the repo root used to walk `benchmarks/` and the root-level probe
# scripts, whose module-level side effects (a real server spawn, a weights download)
# aborted collection outright. Tests live in `tests/`; everything else is a script.
testpaths = [ "tests" ]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pyproject-fmt]
indent = 4

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
overrides = [ { module = [
    "pypdfium2",
    "transformers.*",
], ignore_missing_imports = true } ]

[tool.bumpversion]
current_version = "0.8.2"
commit = true
files = [
    { replace = 'version = "{new_version}"', filename = "pyproject.toml", search = 'version = "{current_version}"' },
    { replace = '"version": "{new_version}"', filename = "manifest.json", search = '"version": "{current_version}"' },
    { replace = '"version": "{new_version}"', filename = "server.json", search = '"version": "{current_version}"' },
    { replace = "download/v{new_version}", filename = "server.json", search = "download/v{current_version}" },
]
pre_commit_hooks = [
    "uv sync",
    "git add uv.lock",
]

