name: Release
# Builds the .mcpb bundle and attaches it to a GitHub release. Deliberately does NOT publish to the MCP Registry -- see docs/Registry_Publish.md.

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create package artifact
        run: npx @anthropic-ai/mcpb pack
      - name: Release
        # A tag carrying a pre-release suffix (v0.8.2-rc.1) is marked as a prerelease,

        # so it does not become the "Latest" release the README points at.
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mcpb"
          prerelease: ${{ contains(github.ref_name, '-') }}
