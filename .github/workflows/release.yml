name: Release
# Builds the .mcpb bundle and attaches it to a GitHub release. Deliberately does NOT publish to the MCP Registry -- see docs/Registry_Publish.md.

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create package artifact (named explicitly -- pack's default uses the working dir's basename, not the package name)
        run: npx @anthropic-ai/mcpb pack . fusion-vision-mcp.mcpb
      - name: Release (prerelease auto-set for a suffixed tag, e.g. v0.8.2-rc.1)
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mcpb"
          prerelease: ${{ contains(github.ref_name, '-') }}
